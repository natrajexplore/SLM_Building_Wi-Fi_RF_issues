# QLoRA preset for a Colab T4 (16 GB, Turing -> fp16, no bf16), tuned for
# quality rather than copied from the 8 GB preset.
#
#   python -m training.train --dry-run --config training/qlora_config.t4.yaml
#   python -m training.train --config training/qlora_config.t4.yaml --resume
#
# What changed vs the 8 GB preset, and why:
#   - LoRA r/alpha 16/32 (was 8/16). The T4 has the headroom, and the student
#     has to learn both the strict output contract and fine discriminations
#     between confusable causes -- more adapter capacity helps the second.
#   - batch 2 x grad-accum 16 (was 1 x 32). Same effective batch 32, so the
#     optimisation is unchanged; fewer micro-steps -> noticeably faster.
#     Expected peak ~8-10 GB. If it OOMs, go back to 1 x 32.
#   - eval + save every 20 steps (was 50 -> only ~4 evals in ~222 steps), on a
#     fixed 200-example eval subset so frequent evals stay cheap. The full
#     623-example set is still scored by training/evaluate.py afterwards.
#   - load_best_model_at_end on eval_loss + early stopping (patience 3). The
#     adapter written to output_dir is the lowest-eval-loss checkpoint, not
#     the last step; 3 epochs on ~2.4k narrow examples can overfit by the end.
#   - warmup 5% (was 3%): with LoRA r=16 the first steps are a bit noisier.
#   - max_seq_length stays 1536: the longest example is 1528 tokens, so
#     nothing is truncated.

base_model: "Qwen/Qwen2.5-1.5B-Instruct"

data:
  train_file: "data/train.jsonl"
  eval_file: "data/eval.jsonl"
  max_seq_length: 1536
  mask_prompt: true
  eval_max_samples: 200                  # in-training eval subset (seeded)

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"      # T4 is Turing: no bf16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: "training/out"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16        # effective batch 32
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.0
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 20
  save_strategy: "steps"
  save_steps: 20
  save_total_limit: 3                    # the best checkpoint is always kept on top of this
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  early_stopping_patience: 3             # stop after 3 evals (60 steps) with no improvement
  bf16: false                            # T4 is Turing: no bf16 (train.py then sets fp16)
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  seed: 7

generation_defaults:
  diagnose_temperature: 0.15
  explain_temperature: 0.8
