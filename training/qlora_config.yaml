# QLoRA fine-tune configuration for the RF root-cause student.
#
# Settled in CLAUDE.md (hard design decision #2): the student base is
# Qwen2.5-1.5B-Instruct (primary) or Llama-3.2-1B-Instruct (fallback), trained
# with QLoRA in 4-bit on a single GPU. The teacher does NOT appear here — it
# only produced data/train.jsonl offline.

base_model: "Qwen/Qwen2.5-1.5B-Instruct"
# fallback: "meta-llama/Llama-3.2-1B-Instruct"  (swap base_model + lora.target_modules)

data:
  train_file: "data/train.jsonl"
  eval_file: "data/eval.jsonl"
  # Records are chat-format {"messages": [...]}. The prompt (system+user) is
  # loss-masked; only the assistant JSON contributes to the loss.
  # The synthetic set's longest tokenised example is 1528 tokens (p99 ~1475),
  # so 2048 fits every record uncut with headroom. 4096 just wastes memory.
  max_seq_length: 2048
  mask_prompt: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # Qwen2.5 attention + MLP projections. For the Llama-3.2 fallback the module
  # names are the same, so this list carries over unchanged.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: "training/out"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8      # effective batch 32
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  seed: 7

# Serving reminder (not consumed by train.py): the diagnosis path runs this
# adapter at temperature 0.1-0.2. The explanation path is a separate prompt at
# 0.7-0.9. Never wire one global temperature. See CLAUDE.md.
generation_defaults:
  diagnose_temperature: 0.15
  explain_temperature: 0.8
